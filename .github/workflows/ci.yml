# Runs every test on each push and pull request. Uses no secrets: AI and GitHub sign-in are tested
# against fake services, and sign-in emails are read from the server log.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Check dependencies for known vulnerabilities
        run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Security checks
        run: npm run test:security
      - name: Sign-in and sharing
        run: npm run test:access
      - name: AI rephrase against a fake Claude API
        run: npm run test:rephrase
      - name: Backup and restore drill
        run: npm run test:backup
      - name: Live editing and formatting (local mode)
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/healthz && break; sleep 1; done
          npm test
          npm run test:formatting
      - name: Server log
        if: failure()
        run: cat server.log || true
