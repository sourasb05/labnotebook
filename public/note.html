<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labnotebook</title>
<script src="/assets/theme.js"></script>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/katex/katex.min.css">
<link rel="icon" href="/assets/favicon.png" type="image/png">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body class="note-page">
<svg width="0" height="0" class="sprite" aria-hidden="true">
  <symbol id="i-undo" viewBox="0 0 16 16"><path d="M5.5 3.5 2.5 6.5l3 3M2.5 6.5h7a3.5 3.5 0 0 1 0 7H7"/></symbol>
  <symbol id="i-redo" viewBox="0 0 16 16"><path d="M10.5 3.5l3 3-3 3M13.5 6.5h-7a3.5 3.5 0 0 0 0 7H9"/></symbol>
  <symbol id="i-bold" viewBox="0 0 16 16"><path d="M4.5 2.5h4.25a2.75 2.75 0 0 1 0 5.5H4.5zM4.5 8h5a2.75 2.75 0 0 1 0 5.5h-5z" stroke-width="1.9"/></symbol>
  <symbol id="i-italic" viewBox="0 0 16 16"><path d="M10.5 2.5H6.5M9.5 13.5h-4M9 2.5l-2 11"/></symbol>
  <symbol id="i-strike" viewBox="0 0 16 16"><path d="M2.5 8h11M11 4.6c-.6-1.2-1.9-2.1-3.4-2.1-2 0-3.3 1.1-3.3 2.6 0 1 .6 1.7 1.8 2.2M5 11.4c.6 1.3 1.9 2.1 3.5 2.1 2.1 0 3.4-1.1 3.4-2.6 0-.6-.2-1.1-.5-1.5"/></symbol>
  <symbol id="i-code" viewBox="0 0 16 16"><path d="M5.5 4 1.5 8l4 4M10.5 4l4 4-4 4"/></symbol>
  <symbol id="i-link" viewBox="0 0 16 16"><path d="M6.8 9.2a3 3 0 0 0 4.2 0l2.1-2.1a3 3 0 0 0-4.2-4.2l-.9.9M9.2 6.8a3 3 0 0 0-4.2 0L2.9 8.9a3 3 0 0 0 4.2 4.2l.9-.9"/></symbol>
  <symbol id="i-quote" viewBox="0 0 16 16"><path d="M2.5 2.5v11M5.5 4.5h8M5.5 8h8M5.5 11.5h5"/></symbol>
  <symbol id="i-ul" viewBox="0 0 16 16"><path d="M6 4h8M6 8h8M6 12h8"/><circle cx="2.6" cy="4" r="1" fill="currentColor" stroke="none"/><circle cx="2.6" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="2.6" cy="12" r="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-ol" viewBox="0 0 16 16"><path d="M6.5 4h7.5M6.5 8h7.5M6.5 12h7.5M2.2 2.5h.9v3.6M1.8 6.1h2.2M1.8 9.6c.2-.6 2-.8 2 .3 0 .9-2 1.6-2 2.8h2.1" stroke-width="1.3"/></symbol>
  <symbol id="i-table" viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="11" rx="1.5"/><path d="M2 6.5h12M2 10h12M6.5 6.5v7"/></symbol>
  <symbol id="i-codeblock" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6.2 6.3 4.5 8l1.7 1.7M9.8 6.3 11.5 8l-1.7 1.7"/></symbol>
  <symbol id="i-sigma" viewBox="0 0 16 16"><path d="M12 3H4l4.5 5L4 13h8"/></symbol>
  <symbol id="i-hr" viewBox="0 0 16 16"><path d="M2 8h12"/><path d="M2 4h5M2 12h8" opacity=".35"/></symbol>
  <symbol id="i-marker" viewBox="0 0 16 16"><path d="M10 1.8l4.2 4.2-6.3 6.3H3.7V8.1zM8.3 3.5l4.2 4.2"/></symbol>
  <symbol id="i-sparkle" viewBox="0 0 16 16"><path d="M7 1.5l1.3 3.7L12 6.5 8.3 7.8 7 11.5 5.7 7.8 2 6.5l3.7-1.3zM12.3 9.8l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-download" viewBox="0 0 16 16"><path d="M8 2.5v8M4.5 7.5 8 11l3.5-3.5M2.5 13.5h11"/></symbol>
  <symbol id="i-chev" viewBox="0 0 16 16"><path d="M4.5 6.5 8 10l3.5-3.5"/></symbol>
  <symbol id="i-eraser" viewBox="0 0 16 16"><path d="M6.5 13.5h7M2.8 10.3l6.4-6.8 4 4-5.8 6H5.9z"/></symbol>
</svg>

<header class="bar">
  <a class="brand" href="/" title="All notes"><img class="logo" src="/assets/logo-mark.png" alt="" width="28" height="28"><span class="brand-name">Labnotebook</span></a>
  <span class="bar-sep" aria-hidden="true"></span>
  <span id="title" class="title">Loading…</span>
  <span id="status" class="status warn">Connecting…</span>
  <span id="role-badge" class="role-badge" hidden>View only</span>
  <div class="spacer"></div>
  <div class="presence"><span id="people"></span><span id="count" class="muted"></span></div>
  <input id="name" class="name" aria-label="Your name" maxlength="40">
  <div class="modes" role="group" aria-label="View mode">
    <button data-set-mode="edit">Edit</button>
    <button data-set-mode="both">Both</button>
    <button data-set-mode="view">View</button>
  </div>
  <button id="rephrase" class="ai-btn" title="Rephrase the selected text with AI" hidden><svg class="ic"><use href="#i-sparkle"/></svg><span>Rephrase</span></button>
  <button id="appearance-btn" class="ghost icon-btn aa" data-pop="pop-appearance" title="Appearance: fonts, size, theme" aria-haspopup="true" aria-expanded="false">Aa</button>
  <button id="download" class="ghost icon-btn" title="Download as .md"><svg class="ic"><use href="#i-download"/></svg></button>
  <button id="share" class="primary" data-pop="pop-share" aria-haspopup="true" aria-expanded="false">Share</button>
</header>

<div class="toolbar" role="toolbar" aria-label="Formatting">
  <button class="tb" data-cmd="undo" title="Undo (Ctrl+Z)"><svg class="ic"><use href="#i-undo"/></svg></button>
  <button class="tb" data-cmd="redo" title="Redo (Ctrl+Shift+Z)"><svg class="ic"><use href="#i-redo"/></svg></button>
  <span class="tb-sep"></span>
  <button class="tb tb-text" data-cmd="h1" title="Heading 1">H1</button>
  <button class="tb tb-text" data-cmd="h2" title="Heading 2">H2</button>
  <button class="tb tb-text" data-cmd="h3" title="Heading 3">H3</button>
  <span class="tb-sep"></span>
  <button class="tb" data-cmd="bold" title="Bold (Ctrl+B)"><svg class="ic"><use href="#i-bold"/></svg></button>
  <button class="tb" data-cmd="italic" title="Italic (Ctrl+I)"><svg class="ic"><use href="#i-italic"/></svg></button>
  <button class="tb" data-cmd="strike" title="Strikethrough (Ctrl+Shift+X)"><svg class="ic"><use href="#i-strike"/></svg></button>
  <button class="tb" data-cmd="code" title="Inline code (Ctrl+E)"><svg class="ic"><use href="#i-code"/></svg></button>
  <span class="tb-sep"></span>
  <button class="tb color-btn" data-pop="pop-color" title="Text colour" aria-haspopup="true" aria-expanded="false"><span class="glyph-a">A</span><i class="bar-swatch" id="swatch-text"></i></button>
  <button class="tb color-btn" data-pop="pop-highlight" title="Highlight (Ctrl+Shift+H)" aria-haspopup="true" aria-expanded="false"><svg class="ic"><use href="#i-marker"/></svg><i class="bar-swatch" id="swatch-highlight"></i></button>
  <span class="tb-sep"></span>
  <button class="tb" data-cmd="link" title="Link (Ctrl+K)"><svg class="ic"><use href="#i-link"/></svg></button>
  <button class="tb" data-cmd="quote" title="Quote"><svg class="ic"><use href="#i-quote"/></svg></button>
  <button class="tb" data-cmd="ul" title="Bulleted list"><svg class="ic"><use href="#i-ul"/></svg></button>
  <button class="tb" data-cmd="ol" title="Numbered list"><svg class="ic"><use href="#i-ol"/></svg></button>
  <button class="tb" data-cmd="table" title="Table"><svg class="ic"><use href="#i-table"/></svg></button>
  <button class="tb" data-cmd="codeblock" title="Code block"><svg class="ic"><use href="#i-codeblock"/></svg></button>
  <span class="tb-sep"></span>
  <button class="tb tb-text tb-math" data-cmd="math" title="Inline math $…$">$x$</button>
  <button class="tb" data-cmd="mathblock" title="Equation block $$…$$"><svg class="ic"><use href="#i-sigma"/></svg></button>
  <button class="tb" data-cmd="hr" title="Divider"><svg class="ic"><use href="#i-hr"/></svg></button>
  <span class="tb-fill"></span>
  <span id="wordcount" class="wordcount" title="Words · characters"></span>
</div>

<div id="banner" class="banner" role="alert" hidden></div>
<main data-mode="both">
  <section id="editor" class="pane editor-pane" aria-label="Markdown editor"></section>
  <section id="preview-wrap" class="pane preview-pane" aria-label="Preview"><article id="preview" class="markdown-body"></article></section>
</main>

<!-- Popovers (positioned next to their button by editor.js) -->
<div id="pop-color" class="popover" role="dialog" aria-label="Text colour" hidden>
  <div class="pop-title">Text colour</div>
  <div class="swatches" data-kind="text"></div>
  <div class="pop-row"><label class="custom">Custom <input type="color" id="custom-text" value="#3657d6"></label>
    <button class="ghost small" data-clear="text"><svg class="ic"><use href="#i-eraser"/></svg>Remove</button></div>
</div>
<div id="pop-highlight" class="popover" role="dialog" aria-label="Highlight colour" hidden>
  <div class="pop-title">Highlight</div>
  <div class="swatches" data-kind="highlight"></div>
  <div class="pop-row"><label class="custom">Custom <input type="color" id="custom-highlight" value="#fff3a3"></label>
    <button class="ghost small" data-clear="highlight"><svg class="ic"><use href="#i-eraser"/></svg>Remove</button></div>
</div>
<div id="pop-appearance" class="popover appearance" role="dialog" aria-label="Appearance" hidden>
  <div class="pop-title">Appearance <span class="muted">· only for you</span></div>
  <label class="field" for="ap-editor-font"><span>Editor font</span><select id="ap-editor-font"></select></label>
  <label class="field" for="ap-preview-font"><span>Preview font</span><select id="ap-preview-font"></select></label>
  <div class="field"><span>Text size</span><div class="seg" id="ap-size" role="group" aria-label="Text size">
    <button data-v="s">S</button><button data-v="m">M</button><button data-v="l">L</button><button data-v="xl">XL</button></div></div>
  <div class="field"><span>Theme</span><div class="seg" id="ap-theme" role="group" aria-label="Theme">
    <button data-v="system">Auto</button><button data-v="light">Light</button><button data-v="sepia">Paper</button><button data-v="dark">Dark</button></div></div>
  <div class="field"><span>Page width</span><div class="seg" id="ap-width" role="group" aria-label="Page width">
    <button data-v="narrow">Narrow</button><button data-v="wide">Wide</button></div></div>
</div>

<div id="pop-share" class="popover share" role="dialog" aria-label="Share this note" hidden>
  <div class="pop-title">Share</div>
  <div class="share-link">
    <input id="share-url" readonly aria-label="Link to this note">
    <button id="share-copy" class="small" type="button">Copy link</button>
  </div>
  <div id="share-owner-ui" hidden>
    <label class="field" for="share-mode"><span>General access</span>
      <select id="share-mode">
        <option value="private">Only people added below</option>
        <option value="link_view">Anyone signed in with the link can view</option>
        <option value="link_edit">Anyone signed in with the link can edit</option>
      </select>
    </label>
    <p class="small-note muted" id="share-domains"></p>
    <form id="share-add" class="share-add">
      <input id="share-email" type="email" placeholder="name@your-university.edu" aria-label="Email address to add" required>
      <select id="share-role" aria-label="Role for this person">
        <option value="viewer">Can view</option>
        <option value="editor" selected>Can edit</option>
        <option value="owner">Owner</option>
      </select>
      <button class="primary small" type="submit">Add</button>
    </form>
    <ul id="share-people" class="people-list" aria-label="People with access"></ul>
  </div>
  <p id="share-info" class="small-note muted"></p>
  <p id="share-error" class="error small-note" role="alert" hidden></p>
</div>

<aside id="ai-panel" class="ai-panel" aria-label="AI rephrase" hidden>
  <div class="ai-head"><b><svg class="ic"><use href="#i-sparkle"/></svg> Rephrase</b><span id="ai-status" class="muted" aria-live="polite"></span></div>
  <label for="ai-result" class="ai-label">Suggestion (you can edit it before replacing)</label>
  <textarea id="ai-result" rows="7" spellcheck="true"></textarea>
  <label for="ai-request" class="ai-label">Ask for something different (optional)</label>
  <input id="ai-request" maxlength="200" placeholder="e.g. more formal, shorter, simpler words">
  <div class="ai-actions">
    <button id="ai-replace" class="primary" disabled>Replace selection</button>
    <button id="ai-retry">Try again</button>
    <button id="ai-cancel" class="ghost">Cancel</button>
  </div>
  <p class="ai-note muted">Only the selected text is sent to Anthropic's Claude.</p>
</aside>
<div id="toast" class="toast" hidden></div>
<script type="module" src="/assets/editor.js"></script>
</body>
</html>
