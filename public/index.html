<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labnotebook</title>
<link rel="icon" href="/assets/favicon.png" type="image/png">
<script src="/assets/theme.js"></script>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body class="home-page">
<header class="bar">
  <a class="brand" href="/"><img class="logo" src="/assets/logo-mark.png" alt="" width="28" height="28">Labnotebook</a>
  <div class="spacer"></div>
  <span id="me" class="user-chip" hidden></span>
  <a class="button primary" href="/new">New note</a>
  <form method="post" action="/logout" id="logout" hidden><button type="submit" class="ghost">Sign out</button></form>
</header>
<div class="home">
  <section aria-labelledby="mine-h">
    <h1 id="mine-h">My notes</h1>
    <ul id="mine" class="notes"><li class="muted">Loading…</li></ul>
  </section>
  <section aria-labelledby="shared-h">
    <h2 id="shared-h">Shared with me</h2>
    <ul id="shared" class="notes"><li class="muted">Loading…</li></ul>
  </section>
  <p class="foot muted">Labnotebook is free software under the GNU AGPL-3.0 · <a href="https://github.com/sourasb05/labnotebook" rel="noopener">Source code</a></p>
</div>
<script type="module" src="/assets/home.js"></script>
</body>
</html>
